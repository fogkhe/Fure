services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    init: true
    environment:
      NUXT_API_BASE: http://app:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(3000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      DATABASE_URL: postgresql+asyncpg://fure:fure@database:5432/fure
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      SESSION_LIFETIME_SECONDS: "${SESSION_LIFETIME_SECONDS:-604800}"
      VARIABLES_ENCRYPTION_KEY: "${VARIABLES_ENCRYPTION_KEY:-}"
    volumes:
      - app_data:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: fure
      POSTGRES_PASSWORD: fure
      POSTGRES_DB: fure
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "fure", "-d", "fure"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_data:
  database_data:

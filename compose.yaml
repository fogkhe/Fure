services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://fure:fure@database:5432/fure
    volumes:
      - app_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: fure
      POSTGRES_PASSWORD: fure
      POSTGRES_DB: fure
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fure -d fure"]
      start_period: 3s
      interval: 1s
      timeout: 5s
      retries: 10

volumes:
  app_data:
  database_data:
